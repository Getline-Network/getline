version: 2
jobs:
    metabackend_test:
        docker:
            - image: circleci/golang:1.9
        environment:
            - TEST_RESULTS: "/tmp/gotests"
        working_directory: /go/src/github.com/getline-network/getline
        steps:
           - checkout
           - run: mkdir -p $TEST_RESULTS
           - run: go get github.com/jstemmer/go-junit-report
           - run:
               name: "Run unit tests"
               command: |
                   trap "go-junit-report <${TEST_RESULTS}/go-test.out > ${TEST_RESULTS}/go-test-report.xml" EXIT
                   go test github.com/getline-network/getline/metabackend/deployments | tee ${TEST_RESULTS}/go-test.out
           - store_test_results:
               path: /tmp/gotests
           - store_artifacts:
               path: /tmp/gotests

    dapp_lint:
        docker:
            - image: node:8.7
        working_directory: ~/project/dapp
        steps:
            - checkout:
                path: ~/project
            - restore_cache:
                keys:
                    - dapp1-modules-{{ checksum "yarn.lock" }}
                    - dapp1-modules
            - run: yarn
            - save_cache:
                key: dapp1-modules-{{ checksum "yarn.lock" }}
                paths:
                    - node_modules/
            - run: node_modules/.bin/solium --dir contracts/

    dapp_coverage:
        docker:
            - image: node:8.7
        working_directory: ~/project/dapp
        steps:
            - checkout:
                path: ~/project
            - restore_cache:
                keys:
                    - dapp1-modules-{{ checksum "yarn.lock" }}
                    - dapp1-modules
            - run: yarn
            - save_cache:
                key: dapp1-modules-{{ checksum "yarn.lock" }}
                paths:
                    - node_modules/
            - run: yarn run solidity-coverage
            - store_artifacts:
                path: ~/project/dapp/coverage

    dapp_test:
        docker:
            - image: node:8.7
        working_directory: ~/project/dapp
        steps:
            - checkout:
                path: ~/project
            - run: mkdir ~/project/dapp/junit
            - restore_cache:
                keys:
                    - dapp1-modules-{{ checksum "yarn.lock" }}
                    - dapp1-modules
            - run: yarn
            - save_cache:
                key: dapp1-modules-{{ checksum "yarn.lock" }}
                paths:
                    - node_modules/
            - run:
                command: sh test.sh
                environment:
                    MOCHA_FILE: junit/test-results.xml
            - store_test_results:
                path: ~/project/dapp/junit
            - store_artifacts:
                path: ~/project/dapp/junit

workflows:
    version: 2
    dapp:
        jobs:
            - dapp_test
            - dapp_lint
            - dapp_coverage
            - metabackend_test
